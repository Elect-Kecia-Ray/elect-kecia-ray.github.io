<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Kecia Ray</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    h1 {
      color: #c62828;
      margin-top: 10px;
    }

    h2 {
      color: #1565c0;
      margin-bottom: 20px;
    }

    .donate-box {
      background: #f0f8ff;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .zelle-info {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      color: #000;
    }

    .instructions {
      margin-top: 10px;
      font-size: 16px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Replace this filename after upload -->
    <img src="campaign-photo.jpg" alt="Support Kecia Ray">

    <h1>Kecia Ray</h1>
    <h2>A Heart for Change</h2>

    <p>
      Candidate for Sumner County Commissioner<br>
      District 6
    </p>

    <div class="donate-box">
      <h3>Support the Campaign</h3>

      <p class="instructions">
        Make a contribution using Zelle:
      </p>

      <!-- 🔴 REPLACE THIS -->
      <div class="zelle-info">
        Send to: yourZelle@email.com
      </div>

      <p class="instructions">
        Note: "Campaign Contribution"
      </p>
    </div>

    <div class="footer">
      Paid for by the Committee to Elect Kecia Ray
    </div>

  </div>

</body>
</html>
