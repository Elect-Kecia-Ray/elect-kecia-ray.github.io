<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Kecia Ray</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
}

img {
  width: 100%;
  border-radius: 10px;
}

h1 {
  color: #d32f2f;
  margin-bottom: 5px;
}

h2 {
  color: #1e3a8a;
  margin-top: 0;
}

.donate-box {
  background: #eef5ff;
  padding: 100px;
  border-radius: 10px;
  margin-top: 20px;
}

.zelle-info {
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0;
}

button {
  padding: 12px;
  margin: 6px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

.primary-btn {
  background: #1e3a8a;
  color: white;
}

.amount-btn {
  background: #d32f2f;
  color: white;
}

input {
  width: 90%;
  padding: 10px;
  margin: 8px 0;
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- CAMPAIGN PHOTO -->
  <!--img src="campaign-photo.jpg" alt="Kecia Ray Campaign"-->

  <h1>Kecia Ray</h1>
  <h2>A Heart for Change</h2>

  <p>Sumner County Commissioner – District 6</p>

  <!-- DONATION BOX -->
  <!--<div class="donate-box">-->
    <!--<h3>Support the Campaign</h3>-->

    <!-- 🔴 UPDATE THIS 
    <div class="zelle-info" id="zelleInfo">
      Send via Zelle: yourZelle@email.com
    </div>-->

    <!-- Copy Button 
    <button class="primary-btn" onclick="copyZelle()">Tap to Copy Zelle Info</button>

    <br>-->

    <!-- Open Zelle 
    <a href="https://www.zellepay.com/" target="_blank">
      <button class="primary-btn">Open Zelle</button>
    </a>-->

  </div>

  <!-- QR CODE (EMBEDDED INLINE IMAGE) -->
  <div class="donate-box" width="400px" height="400px">
    <h3>Scan & Share</h3>

    <!-- 🔥 QR CODE GENERATED AUTOMATICALLY -->
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://elect-kecia-ray.github.io/" alt="QR Code">

  </div>

  <!-- VOLUNTEER FORM -->
  <div class="donate-box">
    <h3>Volunteer</h3>

    <!-- 🔴 Replace with your Formspree link -->
    <form action="https://formspree.io/f/yourformid" method="POST">
      <input type="text" name="name" placeholder="Full Name" required><br>
      <input type="email" name="email" placeholder="Email Address" required><br>
      <input type="tel" name="phone" placeholder="Phone Number"><br>
      <button type="submit" class="primary-btn">Join the Campaign</button>
    </form>

  </div>

  <div class="footer">
    Paid for by the Committee to Elect Kecia Ray
  </div>

</div>

<script>
function copyZelle() {
  const text = document.getElementById("zelleInfo").innerText;
  navigator.clipboard.writeText(text);
  alert("Zelle info copied!");
}

function fillAmount(amount) {
  document.getElementById("amountDisplay").innerText =
    "Selected: $" + amount + ". Please enter this in your Zelle payment.";
}
</script>

</body>
</html>
